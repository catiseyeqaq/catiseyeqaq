<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">YuXuanLin Google Gemini Style Banner</title>
  <desc id="desc">Google and Gemini inspired hero banner with Material Design 3 color system, rounded cards, animated accent glows, and automatic light dark adaptation.</desc>
  <defs>
    <linearGradient id="heroBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0b57d0"/>
    </linearGradient>
    <linearGradient id="surfaceGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a73e8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1a73e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34a853" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34a853" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbc04" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fbbc04" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea4335" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ea4335" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a73e8" flood-opacity="0.10"/>
    </filter>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-alt: #f8f9fa;
        --border: #d2e3fc;
        --text-primary: #202124;
        --text-secondary: #5f6368;
        --blue: #1a73e8;
        --blue-strong: #0b57d0;
        --green: #34a853;
        --yellow: #fbbc04;
        --red: #ea4335;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --surface: #1e1e1e;
          --surface-alt: #252525;
          --border: #35558d;
          --text-primary: #f1f3f4;
          --text-secondary: #bdc1c6;
          --blue: #4f8ff0;
          --blue-strong: #3c7fe4;
          --green: #5f9f73;
          --yellow: #c6a64a;
          --red: #c46a61;
        }
      }
      .title {
        font: italic 700 92px Georgia, "Times New Roman", serif;
        fill: var(--text-primary);
        letter-spacing: -1px;
      }
      .eyebrow {
        font: 700 18px "Segoe UI", Arial, sans-serif;
        fill: var(--blue-strong);
        letter-spacing: 3px;
      }
      .subtitle {
        font: italic 600 30px Georgia, "Times New Roman", serif;
        fill: var(--blue);
      }
      .meta {
        font: 500 23px "Segoe UI", Arial, sans-serif;
        fill: var(--text-secondary);
      }
      .quote {
        font: italic 500 28px Georgia, "Times New Roman", serif;
        fill: var(--text-secondary);
      }
      .cardTitle {
        font: 700 24px Georgia, "Times New Roman", serif;
        fill: var(--text-primary);
      }
      .cardBody {
        font: 500 18px "Segoe UI", Arial, sans-serif;
        fill: var(--text-secondary);
      }
      .bg {
        fill: var(--bg);
      }
      .surface {
        fill: var(--surface);
      }
      .surface-alt {
        fill: var(--surface-alt);
      }
      .stroke-main {
        stroke: var(--border);
      }
      .stroke-blue {
        stroke: var(--blue);
      }
      .stroke-green {
        stroke: var(--green);
      }
      .stroke-red {
        stroke: var(--red);
      }
      .stroke-yellow {
        stroke: var(--yellow);
      }
      .accent-blue {
        fill: var(--blue);
      }
      .accent-green {
        fill: var(--green);
      }
      .accent-yellow {
        fill: var(--yellow);
      }
      .accent-red {
        fill: var(--red);
      }
      .spark {
        opacity: 0.65;
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .floatY {
        animation: floatY 6s ease-in-out infinite;
      }
      .floatYSlow {
        animation: floatY 8s ease-in-out infinite;
      }
      .drift {
        animation: drift 12s ease-in-out infinite;
      }
      .lineDraw {
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
        animation: drawLine 3s ease forwards, fadeLine 6s ease-in-out infinite 3s;
      }
      .chip {
        animation: chipGlow 4.8s ease-in-out infinite;
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes drift {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(12px, -10px) scale(1.03); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeLine {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.95; }
      }
      @keyframes chipGlow {
        0%, 100% { opacity: 0.94; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1600" height="760" rx="42" class="bg"/>

  <g filter="url(#softBlur)">
    <circle cx="210" cy="600" r="140" fill="url(#greenGlow)" class="drift"/>
    <circle cx="1270" cy="132" r="104" fill="url(#yellowGlow)" class="floatY"/>
    <circle cx="1425" cy="632" r="120" fill="url(#redGlow)" class="drift"/>
    <circle cx="196" cy="120" r="110" fill="url(#blueGlow)" class="floatYSlow"/>
  </g>

  <rect x="54" y="48" width="1492" height="648" rx="48" fill="url(#surfaceGlow)" class="stroke-main" stroke-width="2" filter="url(#cardShadow)"/>

  <g opacity="0.7">
    <path d="M118 124 H418" class="stroke-blue" stroke-width="6" stroke-linecap="round"/>
    <path d="M1176 640 H1408" class="stroke-blue" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g class="floatYSlow" opacity="0.92">
    <path d="M1206 188 C1280 262 1290 380 1220 592" fill="none" class="stroke-green lineDraw" stroke-width="4" stroke-linecap="round"/>
    <path d="M238 194 C324 276 320 440 178 610" fill="none" class="stroke-blue lineDraw" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g class="spark">
    <ellipse cx="1148" cy="382" rx="34" ry="14" class="accent-blue"/>
    <ellipse cx="1250" cy="534" rx="28" ry="12" class="accent-green"/>
    <ellipse cx="322" cy="454" rx="38" ry="16" class="accent-yellow"/>
  </g>

  <text x="126" y="176" class="eyebrow">GOOGLE AI · GEMINI VISUAL LANGUAGE · REAL-WORLD SYSTEMS</text>
  <text x="126" y="300" class="title">YuXuanLin</text>
  <text x="126" y="350" class="subtitle">building intelligence for the real world</text>
  <text x="126" y="410" class="meta">Master Student at Chongqing Artificial Intelligence Institute</text>

  <text x="880" y="202" class="quote">"Make AI vivid, useful,</text>
  <text x="952" y="248" class="quote">and closer to people."</text>

  <g transform="translate(126 474)" class="chip">
    <rect width="560" height="126" rx="32" class="surface-alt stroke-main" stroke-width="2"/>
    <text x="42" y="48" class="cardTitle">About Me</text>
    <text x="42" y="86" class="cardBody">I build YOLO and multimodal systems for practical</text>
    <text x="42" y="112" class="cardBody">vision tasks, private deployment, and engineering delivery.</text>
  </g>

  <g transform="translate(720 474)" class="chip">
    <rect width="220" height="126" rx="32" class="surface-alt stroke-blue" stroke-width="2"/>
    <text x="36" y="48" class="cardTitle">Vision AI</text>
    <text x="36" y="86" class="cardBody">Detection</text>
    <text x="36" y="112" class="cardBody">Small objects</text>
  </g>

  <g transform="translate(962 474)" class="chip">
    <rect width="226" height="126" rx="32" class="surface-alt stroke-yellow" stroke-width="2"/>
    <text x="36" y="48" class="cardTitle">AI Agents</text>
    <text x="36" y="86" class="cardBody">Workflow</text>
    <text x="36" y="112" class="cardBody">Autonomy</text>
  </g>

  <g transform="translate(1210 474)" class="chip">
    <rect width="250" height="126" rx="32" class="surface-alt stroke-green" stroke-width="2"/>
    <text x="30" y="48" class="cardTitle">Deploy</text>
    <text x="30" y="86" class="cardBody">Edge + Web</text>
    <text x="30" y="112" class="cardBody">Private AI</text>
  </g>

  <g class="spark">
    <circle cx="1308" cy="142" r="12" class="accent-yellow"/>
    <circle cx="1340" cy="118" r="6" class="accent-blue"/>
    <circle cx="296" cy="132" r="8" class="accent-red"/>
    <circle cx="1420" cy="584" r="7" class="accent-green"/>
  </g>
</svg>
