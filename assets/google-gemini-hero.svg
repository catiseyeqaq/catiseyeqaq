<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">YuXuanLin Google Gemini Style Banner</title>
  <desc id="desc">Rounded pastel hero banner with gentle Gemini-inspired motion, colorful glow, quote, and focus cards.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="28%" stop-color="#F8FBFF"/>
      <stop offset="56%" stop-color="#F7F3FF"/>
      <stop offset="100%" stop-color="#F2FBF5"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6C6B2"/>
      <stop offset="33%" stop-color="#B8D7FF"/>
      <stop offset="66%" stop-color="#DCC7FF"/>
      <stop offset="100%" stop-color="#BDE8C8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD79A" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#FFD79A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD79A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8AB4F8" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#8AB4F8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#81C995" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#81C995" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D7AEFB" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#D7AEFB" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#B8C6E0" flood-opacity="0.18"/>
    </filter>
    <style>
      .title {
        font: italic 700 92px Georgia, "Times New Roman", serif;
        fill: #31453b;
        letter-spacing: -1px;
      }
      .eyebrow {
        font: 700 18px "Segoe UI", Arial, sans-serif;
        fill: #7A7266;
        letter-spacing: 3px;
      }
      .subtitle {
        font: italic 600 30px Georgia, "Times New Roman", serif;
        fill: #B07A63;
      }
      .meta {
        font: 500 23px "Segoe UI", Arial, sans-serif;
        fill: #5D6B61;
      }
      .quote {
        font: italic 500 28px Georgia, "Times New Roman", serif;
        fill: #866F64;
      }
      .cardTitle {
        font: 700 24px Georgia, "Times New Roman", serif;
        fill: #445247;
      }
      .cardBody {
        font: 500 18px "Segoe UI", Arial, sans-serif;
        fill: #69746E;
      }
      .spark {
        opacity: 0.65;
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .floatY {
        animation: floatY 6s ease-in-out infinite;
      }
      .floatYSlow {
        animation: floatY 8s ease-in-out infinite;
      }
      .drift {
        animation: drift 12s ease-in-out infinite;
      }
      .lineDraw {
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
        animation: drawLine 3s ease forwards, fadeLine 6s ease-in-out infinite 3s;
      }
      .chip {
        animation: chipGlow 4.8s ease-in-out infinite;
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes drift {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(12px, -10px) scale(1.03); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeLine {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.95; }
      }
      @keyframes chipGlow {
        0%, 100% { transform: translateY(0); opacity: 0.92; }
        50% { transform: translateY(-3px); opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1600" height="760" rx="42" fill="url(#pageBg)"/>

  <g filter="url(#softBlur)">
    <circle cx="250" cy="660" r="140" fill="url(#greenGlow)" class="drift"/>
    <circle cx="1300" cy="120" r="110" fill="url(#sunGlow)" class="floatY"/>
    <circle cx="1450" cy="650" r="140" fill="url(#purpleGlow)" class="drift"/>
    <circle cx="155" cy="105" r="100" fill="url(#blueGlow)" class="floatYSlow"/>
  </g>

  <rect x="54" y="48" width="1492" height="648" rx="48" fill="#FCFBF8" stroke="url(#cardStroke)" stroke-width="2" filter="url(#cardShadow)"/>

  <g opacity="0.7">
    <path d="M108 126 H410" stroke="#E9A38B" stroke-width="6" stroke-linecap="round"/>
    <path d="M1178 640 H1412" stroke="#A796FF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g class="floatYSlow" opacity="0.92">
    <path d="M1178 186 C1265 248 1278 368 1202 598" fill="none" stroke="#6DBD82" stroke-width="4" stroke-linecap="round" class="lineDraw"/>
    <path d="M242 196 C318 272 322 438 152 620" fill="none" stroke="#D39A6E" stroke-width="4" stroke-linecap="round" class="lineDraw"/>
  </g>

  <g class="spark">
    <ellipse cx="1156" cy="390" rx="34" ry="14" fill="#DCC7FF"/>
    <ellipse cx="1250" cy="536" rx="28" ry="12" fill="#B6E6C3"/>
    <ellipse cx="318" cy="450" rx="38" ry="16" fill="#BDEAD6"/>
  </g>

  <text x="126" y="180" class="eyebrow">GOOGLE-STYLE AI · GEMINI VISUAL LANGUAGE · REAL-WORLD SYSTEMS</text>
  <text x="126" y="300" class="title">YuXuanLin</text>
  <text x="126" y="350" class="subtitle">building intelligence for the real world</text>
  <text x="126" y="410" class="meta">Master Student at Chongqing Artificial Intelligence Institute</text>

  <text x="875" y="206" class="quote">"Make AI feel vivid, helpful,</text>
  <text x="934" y="252" class="quote">and closer to people."</text>

  <g transform="translate(126 474)" class="chip">
    <rect width="564" height="126" rx="32" fill="#FBFBF8" stroke="#E8CFC2" stroke-width="2"/>
    <text x="42" y="48" class="cardTitle">About Me</text>
    <text x="42" y="86" class="cardBody">I build YOLO and multimodal systems for practical</text>
    <text x="42" y="112" class="cardBody">vision tasks, private deployment, and engineering delivery.</text>
  </g>

  <g transform="translate(744 474)" class="chip">
    <rect width="224" height="126" rx="32" fill="#FBFBF8" stroke="#CDE0FF" stroke-width="2"/>
    <text x="36" y="48" class="cardTitle">Vision AI</text>
    <text x="36" y="86" class="cardBody">Detection</text>
    <text x="36" y="112" class="cardBody">Small objects</text>
  </g>

  <g transform="translate(990 474)" class="chip">
    <rect width="230" height="126" rx="32" fill="#FBFBF8" stroke="#D9CAFF" stroke-width="2"/>
    <text x="36" y="48" class="cardTitle">AI Agents</text>
    <text x="36" y="86" class="cardBody">Workflow</text>
    <text x="36" y="112" class="cardBody">Autonomy</text>
  </g>

  <g transform="translate(1240 474)" class="chip">
    <rect width="176" height="126" rx="32" fill="#FBFBF8" stroke="#EBD1C5" stroke-width="2"/>
    <text x="28" y="48" class="cardTitle">Deploy</text>
    <text x="28" y="86" class="cardBody">Edge + Web</text>
    <text x="28" y="112" class="cardBody">Private AI</text>
  </g>

  <g class="spark">
    <circle cx="1310" cy="140" r="12" fill="#FFD180"/>
    <circle cx="1340" cy="118" r="6" fill="#8AB4F8"/>
    <circle cx="296" cy="132" r="8" fill="#EA4335"/>
    <circle cx="1425" cy="586" r="7" fill="#34A853"/>
  </g>
</svg>
