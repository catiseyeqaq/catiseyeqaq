  <style>
    :root { --pill:#1a73e8; --surface:#ffffff; --label:#202124; --value:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --pill:#3c7fe4; --surface:#1e1e1e; --label:#f1f3f4; --value:#f1f3f4; }
    }
  </style>
  <rect x="2" y="2" width="266" height="52" rx="26" fill="var(--pill)"/>
  <rect x="2" y="2" width="178" height="52" rx="26" fill="var(--surface)"/>
  <text x="90" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--label)" letter-spacing="2">FOLLOWERS</text>
  <text x="220" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="var(--value)" letter-spacing="1">2</text>
