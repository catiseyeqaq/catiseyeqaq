<svg xmlns="http://www.w3.org/2000/svg" width="320" height="56" viewBox="0 0 320 56" role="img" aria-label="Rainbow Motion">
  <style>
    @media (prefers-color-scheme: dark) {
      #rainbow stop[offset="0%"] { stop-color: #4f8ff0; }
      #rainbow stop[offset="25%"] { stop-color: #3c7fe4; }
      #rainbow stop[offset="50%"] { stop-color: #5f9f73; }
      #rainbow stop[offset="75%"] { stop-color: #c6a64a; }
      #rainbow stop[offset="100%"] { stop-color: #c46a61; }
    }
  </style>
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="25%" stop-color="#0b57d0"/>
      <stop offset="50%" stop-color="#34a853"/>
      <stop offset="75%" stop-color="#fbbc04"/>
      <stop offset="100%" stop-color="#ea4335"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="316" height="52" rx="26" fill="url(#rainbow)"/>
  <text x="160" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" letter-spacing="2">RAINBOW MOTION</text>
</svg>
