<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t2 d2">
  <title id="t2">Smart Water Management Agent · Dashboard</title>
  <desc id="d2">Dashboard mockup of the smart water management agent: pipe-network topology, runtime time-series, and a risk-relationship panel with human-verification status.</desc>
  <defs>
    <linearGradient id="wtTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0b5d56"/>
    </linearGradient>
    <linearGradient id="wtArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34a853" stop-opacity="0.45"/><stop offset="100%" stop-color="#34a853" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="wtTealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.16"/><stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wtBlueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a73e8" stop-opacity="0.14"/><stop offset="100%" stop-color="#1a73e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="wtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f766e" flood-opacity="0.10"/>
    </filter>
    <style>
      :root{
        --bg:#ffffff; --surface:#ffffff; --surface-alt:#f8f9fa; --border:#cdeae6;
        --text-primary:#202124; --text-secondary:#5f6368;
        --blue:#1a73e8; --green:#34a853; --yellow:#fbbc04; --red:#ea4335; --teal:#0f766e;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#121212; --surface:#1e1e1e; --surface-alt:#252525; --border:#2f5e58;
          --text-primary:#f1f3f4; --text-secondary:#bdc1c6;
          --blue:#4f8ff0; --green:#5f9f73; --yellow:#c6a64a; --red:#c46a61; --teal:#3aa89c;
        }
      }
      .bg{fill:var(--bg);}
      .surface{fill:var(--surface);}
      .surfaceAlt{fill:var(--surface-alt);}
      .strokeMain{stroke:var(--border);}
      .eyebrow{font:700 17px "Segoe UI",Arial,sans-serif;fill:var(--teal);letter-spacing:3px;}
      .title{font:700 42px Georgia,"Times New Roman",serif;fill:var(--text-primary);}
      .subtitle{font:500 21px "Segoe UI",Arial,sans-serif;fill:var(--text-secondary);}
      .panelTitle{font:700 19px Georgia,"Times New Roman",serif;fill:var(--text-primary);}
      .panelEn{font:600 12px "Segoe UI",Arial,sans-serif;fill:var(--text-secondary);letter-spacing:1px;}
      .kpiVal{font:700 30px Georgia,"Times New Roman",serif;fill:var(--text-primary);}
      .kpiLbl{font:500 15px "Segoe UI",Arial,sans-serif;fill:var(--text-secondary);}
      .riskName{font:600 16px "Segoe UI",Arial,sans-serif;fill:var(--text-primary);}
      .riskMeta{font:500 13px "Segoe UI",Arial,sans-serif;fill:var(--text-secondary);}
      .tag{font:600 14px "Segoe UI",Arial,sans-serif;fill:#ffffff;letter-spacing:1px;}
      .note{font:italic 500 18px Georgia,"Times New Roman",serif;fill:var(--text-secondary);}
      .axis{font:500 12px "Segoe UI",Arial,sans-serif;fill:var(--text-secondary);}
      .float{animation:floaty 7s ease-in-out infinite;}
      @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" class="bg"/>
  <g opacity="0.85">
    <circle cx="150" cy="150" r="120" fill="url(#wtBlueGlow)" class="float"/>
    <circle cx="1450" cy="780" r="130" fill="url(#wtTealGlow)" class="float"/>
  </g>

  <!-- Header -->
  <text x="80" y="92" class="eyebrow">DASHBOARD</text>
  <text x="80" y="148" class="title">智慧水务综合管理 Agent</text>
  <text x="80" y="182" class="subtitle">Smart Water Management Agent · 拓扑 · 时序 · 风险关系</text>
  <g>
    <rect x="1232" y="66" width="140" height="38" rx="19" fill="url(#wtTeal)"/>
    <text x="1302" y="90" text-anchor="middle" class="tag">v1.0.0</text>
    <rect x="1384" y="66" width="156" height="38" rx="19" fill="#a142f4"/>
    <text x="1462" y="90" text-anchor="middle" class="tag">LOCAL LLM</text>
  </g>

  <!-- KPI chips -->
  <g filter="url(#wtShadow)"><rect x="60" y="214" width="350" height="58" rx="16" class="surface strokeMain" stroke-width="2"/></g>
  <text x="84" y="250" class="kpiVal">128</text><text x="160" y="250" class="kpiLbl">监测点 · Sensors</text>
  <g filter="url(#wtShadow)"><rect x="434" y="214" width="350" height="58" rx="16" class="surface strokeMain" stroke-width="2"/></g>
  <text x="458" y="250" class="kpiVal">64</text><text x="520" y="250" class="kpiLbl">管网节点 · Nodes</text>
  <g filter="url(#wtShadow)"><rect x="808" y="214" width="350" height="58" rx="16" class="surface strokeMain" stroke-width="2"/></g>
  <text x="832" y="250" class="kpiVal" fill="var(--green)">低</text><text x="884" y="250" class="kpiLbl">当前风险 · Risk</text>
  <g filter="url(#wtShadow)"><rect x="1182" y="214" width="350" height="58" rx="16" class="surface strokeMain" stroke-width="2"/></g>
  <text x="1206" y="250" class="kpiVal" fill="var(--blue)">自动</text><text x="1282" y="250" class="kpiLbl">数据校准 · ETL</text>

  <!-- Left panel: topology -->
  <g filter="url(#wtShadow)"><rect x="60" y="300" width="460" height="380" rx="20" class="surface strokeMain" stroke-width="2"/></g>
  <text x="84" y="340" class="panelTitle">管网拓扑</text>
  <text x="84" y="360" class="panelEn">PIPE-NETWORK TOPOLOGY</text>
  <g stroke="var(--border)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M130 430 L250 400 L380 450 L470 410"/>
    <path d="M130 430 L180 560 L320 600 L450 580"/>
    <path d="M250 400 L180 560"/>
    <path d="M380 450 L320 600"/>
  </g>
  <g>
    <circle cx="130" cy="430" r="13" fill="var(--green)"/>
    <circle cx="250" cy="400" r="13" fill="var(--green)"/>
    <circle cx="380" cy="450" r="15" fill="var(--yellow)"/>
    <circle cx="470" cy="410" r="13" fill="var(--green)"/>
    <circle cx="180" cy="560" r="13" fill="var(--green)"/>
    <circle cx="320" cy="600" r="13" fill="var(--green)"/>
    <circle cx="450" cy="580" r="13" fill="var(--green)"/>
  </g>
  <g>
    <circle cx="120" cy="648" r="8" fill="var(--green)"/><text x="136" y="653" class="riskMeta">正常 Normal</text>
    <circle cx="280" cy="648" r="8" fill="var(--yellow)"/><text x="296" y="653" class="riskMeta">关注 Watch</text>
  </g>

  <!-- Center panel: time-series -->
  <g filter="url(#wtShadow)"><rect x="544" y="300" width="512" height="380" rx="20" class="surface strokeMain" stroke-width="2"/></g>
  <text x="568" y="340" class="panelTitle">运行时序</text>
  <text x="568" y="360" class="panelEn">RUNTIME TIME-SERIES</text>
  <g stroke="var(--border)" stroke-width="1">
    <path d="M590 400 H1030"/><path d="M590 460 H1030"/><path d="M590 520 H1030"/><path d="M590 580 H1030"/>
    <path d="M610 380 V640"/><path d="M730 380 V640"/><path d="M850 380 V640"/><path d="M970 380 V640"/>
  </g>
  <path d="M590 600 L650 560 L710 580 L770 500 L830 520 L890 440 L950 470 L1010 410 L1010 640 L590 640 Z" fill="url(#wtArea)"/>
  <path d="M590 600 L650 560 L710 580 L770 500 L830 520 L890 440 L950 470 L1010 410" fill="none" stroke="var(--green)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="590" y="660" class="axis">t₀</text>
  <text x="1000" y="660" class="axis">tₙ</text>
  <text x="566" y="412" class="axis">HIGH</text>
  <text x="566" y="632" class="axis">LOW</text>

  <!-- Right panel: risk -->
  <g filter="url(#wtShadow)"><rect x="1080" y="300" width="452" height="380" rx="20" class="surface strokeMain" stroke-width="2"/></g>
  <text x="1104" y="340" class="panelTitle">风险关系</text>
  <text x="1104" y="360" class="panelEn">RISK RELATIONSHIP · 人工核验</text>
  <!-- item 1 -->
  <text x="1104" y="412" class="riskName">管段压力异常</text>
  <text x="1104" y="432" class="riskMeta">中 · Medium</text>
  <rect x="1104" y="440" width="404" height="10" rx="5" class="surfaceAlt"/>
  <rect x="1104" y="440" width="220" height="10" rx="5" fill="var(--yellow)"/>
  <text x="1488" y="450" text-anchor="end" class="riskMeta" fill="var(--green)">✓ 已核验</text>
  <!-- item 2 -->
  <text x="1104" y="502" class="riskName">泵站能耗偏高</text>
  <text x="1104" y="522" class="riskMeta">低 · Low</text>
  <rect x="1104" y="530" width="404" height="10" rx="5" class="surfaceAlt"/>
  <rect x="1104" y="530" width="110" height="10" rx="5" fill="var(--green)"/>
  <text x="1488" y="540" text-anchor="end" class="riskMeta" fill="var(--green)">✓ 已核验</text>
  <!-- item 3 -->
  <text x="1104" y="592" class="riskName">水质浊度波动</text>
  <text x="1104" y="612" class="riskMeta">高 · High</text>
  <rect x="1104" y="620" width="404" height="10" rx="5" class="surfaceAlt"/>
  <rect x="1104" y="620" width="340" height="10" rx="5" fill="var(--red)"/>
  <text x="1488" y="630" text-anchor="end" class="riskMeta" fill="var(--yellow)">待核验</text>

  <!-- Deployment strip -->
  <g filter="url(#wtShadow)"><rect x="60" y="700" width="1472" height="56" rx="16" class="surfaceAlt strokeMain" stroke-width="2"/></g>
  <text x="84" y="734" class="riskMeta">部署接口 ·</text>
  <text x="200" y="734" class="tag" fill="var(--teal)">CLI</text>
  <text x="270" y="734" class="tag" fill="var(--teal)">Python API</text>
  <text x="420" y="734" class="tag" fill="var(--teal)">HTML Dashboard</text>
  <text x="640" y="734" class="tag" fill="var(--teal)">Open WebUI</text>

  <text x="800" y="800" text-anchor="middle" class="note">公开仓库默认使用合成数据，真实管网与监测资料不进入 Git · 支持部署侧 ETL / 校准</text>
</svg>
