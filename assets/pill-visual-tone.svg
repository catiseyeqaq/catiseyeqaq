<svg xmlns="http://www.w3.org/2000/svg" width="280" height="56" viewBox="0 0 280 56" role="img" aria-label="Visual Tone">
  <style>
    :root { --pill:#fbbc04; --text:#202124; }
    @media (prefers-color-scheme: dark) { :root { --pill:#c6a64a; --text:#121212; } }
  </style>
  <rect x="2" y="2" width="276" height="52" rx="26" fill="var(--pill)"/>
  <text x="140" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--text)" letter-spacing="2">VISUAL TONE</text>
</svg>
