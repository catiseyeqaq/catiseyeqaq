  <rect x="2" y="2" width="276" height="52" rx="26" fill="var(--pill)"/>
  <text x="140" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--text)" letter-spacing="2">GEMINI STYLE</text>
</svg>
